name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-lint:
    name: Build, Test and Lint
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.21"
        cache: true
        
    - name: Verify dependencies
      run: go mod verify
      
    - name: Build
      run: go build -v ./...
      
    - name: Run tests
      run: go test -race -coverprofile=coverage.out -covermode=atomic -v ./...
      
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v3
      with:
        version: latest
        args: --timeout=5m

  compatibility:
    name: GoFrame Compatibility
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        gf-version: ["v2.6.0", "v2.7.0"]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.21"
        cache: true
        
    - name: Test with GoFrame ${{ matrix.gf-version }}
      run: |
        go mod edit -require=github.com/gogf/gf/v2@${{ matrix.gf-version }}
        go mod tidy
        go test -v ./tests/
